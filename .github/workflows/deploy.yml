name: Deploy WIFI to Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wifi-production-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.WIFI_BUILD_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "03295d1fe8b8e4fef8ce9c2cb32a2534"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Verify Cloudflare credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret WIFI_BUILD_TOKEN is missing."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
      - name: Deploy wifi Worker and static assets (retry on failure)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Deployment attempt ${attempt}/3"
            if npx wrangler deploy --name wifi; then
              echo "Deployment succeeded on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Deployment failed. Retrying in ${delay} seconds..."
              sleep "$delay"
            fi
          done

          echo "::error::Deployment failed after 3 attempts."
          exit 1
